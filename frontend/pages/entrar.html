<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Lar de Patas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../" data-pagina="entrar">
  <div id="navbar"></div>
  <main class="secao">
    <div class="container" style="max-width: 460px;">
      <h1>Entrar</h1>
      <p class="text-muted">Área para responsáveis por animais: cadastre animais e acompanhe os interessados.</p>
      <form id="form-entrar" class="cartao-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input id="email" type="email" class="form-control" autocomplete="username" required>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>
        <div class="mb-4">
          <label for="senha" class="form-label">Senha</label>
          <input id="senha" type="password" class="form-control" autocomplete="current-password" required>
          <div class="invalid-feedback">Informe a senha.</div>
        </div>
        <div id="erro-envio" class="alert alert-danger d-none" role="alert"></div>
        <button type="submit" class="btn btn-sol btn-lg w-100">Entrar</button>
      </form>
      <p class="text-center mt-3">Ainda não tem conta? <a href="criar-conta.html">Criar conta</a></p>
    </div>
  </main>
  <div id="rodape"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/entrar.js"></script>
</body>
</html>
