<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animais para adoção — Lar de Patas</title>
  <meta name="description" content="Plataforma de adoção responsável: conheça animais que esperam por um lar e fale direto com quem cuida deles.">
  <meta name="theme-color" content="#1f6f78">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f6f78'/%3E%3Cg fill='%23f4c542'%3E%3Cellipse cx='32' cy='42' rx='13' ry='10.5'/%3E%3Ccircle cx='16.5' cy='29' r='5.5'/%3E%3Ccircle cx='26.5' cy='19.5' r='5.5'/%3E%3Ccircle cx='37.5' cy='19.5' r='5.5'/%3E%3Ccircle cx='47.5' cy='29' r='5.5'/%3E%3C/g%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../" data-pagina="animais">
  <div id="navbar"></div>

  <main>
    <header class="topo-pagina">
      <div class="container">
        <h1 class="mb-2">Animais para adoção</h1>
        <p class="text-muted mb-0 limite">Escolha pelo perfil que combina com a sua casa e a sua rotina. <span id="contador" aria-live="polite"></span></p>
      </div>
    </header>

    <div class="secao pt-4">
      <div class="container">
        <!-- Em telas pequenas os filtros ficam recolhidos atrás deste botão (collapse do Bootstrap) -->
        <button class="btn btn-outline-dark d-lg-none mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#painel-filtros" aria-expanded="false" aria-controls="painel-filtros">
          <i class="bi bi-funnel"></i> Filtrar animais
        </button>
        <div class="row g-4">
          <!-- FILTROS -->
          <aside class="col-lg-3">
            <div class="collapse d-lg-block" id="painel-filtros">
              <form id="form-filtros" class="painel-filtros" aria-label="Filtros de animais">
                <h2 class="h5 mb-3">Filtrar</h2>
                <div class="mb-3">
                  <label for="filtro-especie" class="form-label">Espécie</label>
                  <select id="filtro-especie" name="especie" class="form-select">
                    <option value="">Todas</option><option>Cachorro</option><option>Gato</option><option>Coelho</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="filtro-porte" class="form-label">Porte</label>
                  <select id="filtro-porte" name="porte" class="form-select">
                    <option value="">Todos</option><option>Pequeno</option><option>Médio</option><option>Grande</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="filtro-sexo" class="form-label">Sexo</label>
                  <select id="filtro-sexo" name="sexo" class="form-select">
                    <option value="">Todos</option><option>Macho</option><option>Fêmea</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="filtro-cidade" class="form-label">Localização</label>
                  <select id="filtro-cidade" name="cidade" class="form-select"><option value="">Todas</option></select>
                </div>
                <button type="reset" class="btn btn-outline-dark w-100">Limpar filtros</button>
              </form>
            </div>
          </aside>

          <!-- LISTA DE ANIMAIS -->
          <section class="col-lg-9" aria-label="Lista de animais">
            <div class="row g-4" id="lista-animais"></div>
            <div id="sem-resultados" class="text-center py-5 d-none">
              <h2 class="h5">Nenhum animal encontrado com esses filtros</h2>
              <p class="text-muted">Tente remover algum filtro para ver mais opções.</p>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div id="rodape"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ilustracoes.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/animais.js"></script>
</body>
</html>
