# ===== Conexão com o PostgreSQL (valores padrão batem com o docker-compose.yml) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adocao}
spring.datasource.username=${DB_USER:adocao}
spring.datasource.password=${DB_PASSWORD:adocao}

# ===== Esquema do banco =====
# O Flyway cria/atualiza as tabelas a partir de src/main/resources/db/migration (V1, V2...).
# Em um banco que já tem tabelas mas nunca usou Flyway, ele "adota" o esquema atual (baseline).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# O Hibernate só CONFERE se as entidades batem com as tabelas ("validate").
# Se o deploy falhar com erro "Schema-validation", defina DDL_AUTO=none para ligar a API
# e me envie o log. NUNCA use DDL_AUTO=create ou update: o Flyway é o dono do esquema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Perfil "dev" carrega animais fictícios se o banco estiver vazio (ver config/DadosIniciais)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Hospedagens informam a porta pela variável PORT
server.port=${PORT:8080}

# Origens autorizadas a chamar a API (CORS), separadas por vírgula.
# Em produção defina CORS_ORIGINS=https://SEU-USUARIO.github.io
app.cors.origens=${CORS_ORIGINS:*}

# ===== Login (JWT) =====
# JWT_SECRET: texto longo e aleatório (mín. 32 caracteres). Se não for definido, um segredo
# aleatório é gerado a cada início (os logins deixam de valer quando a API reinicia).
app.jwt.segredo=${JWT_SECRET:}
app.jwt.validade-horas=${JWT_HORAS:12}

# Mensagens de validação em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
