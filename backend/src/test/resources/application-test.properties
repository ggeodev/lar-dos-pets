# Perfil "test": banco H2 em memória (não precisa de PostgreSQL nem Docker).
spring.datasource.url=jdbc:h2:mem:adocao;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.jwt.segredo=segredo-de-teste-com-mais-de-trinta-e-dois-caracteres
app.cors.origens=*
